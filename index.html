<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comando João - Rumo à GNR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --azul-escuro: #0a192f;
            --verde-gnr: #1b4332;
            --neon-green: #52b788;
            --text-light: #e0e0e0;
            --accent-gold: #ffcc00;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--azul-escuro);
            color: var(--text-light);
            margin: 0;
            padding-bottom: 50px;
        }

        header {
            width: 100%;
            padding: 20px 0;
            background: linear-gradient(135deg, var(--azul-escuro), var(--verde-gnr));
            text-align: center;
            border-bottom: 2px solid var(--neon-green);
        }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; margin: 0; color: var(--neon-green); }

        nav {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 10px;
            font-size: 0.8rem;
            border: 1px solid var(--neon-green);
            background: transparent;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .tab-btn.active { background: var(--neon-green); color: var(--azul-escuro); font-weight: bold; }

        .container { width: 95%; max-width: 900px; margin: auto; }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 5px solid var(--neon-green);
        }

        /* Tabela Ajustada para Mobile */
        .table-container { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        th, td { padding: 8px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        th { background: var(--verde-gnr); }

        .input-group { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        input { width: 100%; padding: 12px; border-radius: 4px; border: none; box-sizing: border-box; background: #fff; color: #000; }

        .btn-action {
            background: var(--neon-green);
            color: var(--azul-escuro);
            border: none;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 5px;
        }

        #motivationDisplay {
            text-align: center;
            font-size: 0.9rem;
            color: var(--accent-gold);
            margin: 10px 0;
            min-height: 1.2rem;
        }

        canvas { background: rgba(0,0,0,0.3); border-radius: 8px; max-height: 250px; }
    </style>
</head>
<body>

<header>
    <h1>TREINO DO JOÃO</h1>
    <div id="motivationDisplay">Pronto para a instrução?</div>
</header>

<nav>
    <button class="tab-btn active" onclick="showPage('home')">🏠 Home</button>
    <button class="tab-btn" onclick="showPage('abdominais')">💪 Abs</button>
    <button class="tab-btn" onclick="showPage('barras')">🦾 Barras</button>
    <button class="tab-btn" onclick="showPage('corrida')">🏃 Corrida</button>
</nav>

<div class="container">
    
    <div id="home" class="page active">
        <div class="card">
            <h3 style="font-size:1rem;">📈 Resistência (Metros)</h3>
            <canvas id="resilienceChart"></canvas>
        </div>
    </div>

    <div id="abdominais" class="page">
        <div class="card">
            <h3>📅 Plano: Abdominais</h3>
            <div class="input-group">
                <input type="number" id="valAbs" placeholder="Qtd realizada">
                <button class="btn-action" onclick="save('abdominais')">Gravar</button>
            </div>
            <div class="table-container">
                <table id="tableAbdominais">
                    <thead><tr><th>Data</th><th>Qtd</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="barras" class="page">
        <div class="card">
            <h3>📅 Plano: Barras</h3>
            <div class="input-group">
                <input type="number" id="valBarras" placeholder="Repetições">
                <button class="btn-action" onclick="save('barras')">Gravar</button>
            </div>
            <div class="table-container">
                <table id="tableBarras">
                    <thead><tr><th>Data</th><th>Reps</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="corrida" class="page">
        <div class="card">
            <h3>🏃 Registo de Corrida</h3>
            <div class="input-group">
                <input type="number" id="corridaMetros" placeholder="Distância (Metros)">
                <input type="text" id="corridaTempo" placeholder="Tempo (ex: 20:00)">
                <input type="number" id="corridaBPM" placeholder="BPM Máximo (Relógio)">
                <button class="btn-action" onclick="saveCorrida()">Gravar Treino</button>
            </div>
            <div class="table-container">
                <table id="tableCorrida">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Metros</th>
                            <th>Tempo</th>
                            <th>BPM</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const frases = [
        "Para que outros possam viver! 🇵🇹",
        "A disciplina é a tua melhor arma.",
        "O suor no treino poupa o sangue na batalha.",
        "Foco na meta, a GNR espera por ti!"
    ];

    let chart;

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(event) event.currentTarget.classList.add('active');
        if(id === 'home') initChart();
    }

    // Função para Corrida (com os novos slots)
    function saveCorrida() {
        const m = document.getElementById('corridaMetros').value;
        const t = document.getElementById('corridaTempo').value;
        const bpm = document.getElementById('corridaBPM').value;

        if(!m || !t) return alert("Preenche metros e tempo!");

        const entry = { 
            date: new Date().toLocaleDateString('pt-PT'), 
            metros: m, 
            tempo: t, 
            bpm: bpm || "--" 
        };

        let logs = JSON.parse(localStorage.getItem('gnr_corrida_v2') || "[]");
        logs.push(entry);
        localStorage.setItem('gnr_corrida_v2', JSON.stringify(logs));

        document.getElementById('motivationDisplay').innerText = "🔥 " + frases[Math.floor(Math.random() * frases.length)];
        renderTables();
    }

    // Função para Abs e Barras
    function save(tipo) {
        const val = document.getElementById('val' + tipo.charAt(0).toUpperCase() + tipo.slice(1)).value;
        if(!val) return;

        const entry = { date: new Date().toLocaleDateString('pt-PT'), value: val };
        let logs = JSON.parse(localStorage.getItem('gnr_' + tipo) || "[]");
        logs.push(entry);
        localStorage.setItem('gnr_' + tipo, JSON.stringify(logs));

        document.getElementById('motivationDisplay').innerText = "💪 " + frases[Math.floor(Math.random() * frases.length)];
        renderTables();
    }

    function renderTables() {
        // Render Corrida
        const logsCorrida = JSON.parse(localStorage.getItem('gnr_corrida_v2') || "[]");
        document.querySelector(`#tableCorrida tbody`).innerHTML = logsCorrida.map(l => 
            `<tr><td>${l.date}</td><td>${l.metros}m</td><td>${l.tempo}</td><td>${l.bpm}</td></tr>`
        ).reverse().join('');

        // Render Outros
        ['abdominais', 'barras'].forEach(tipo => {
            const logs = JSON.parse(localStorage.getItem('gnr_' + tipo) || "[]");
            const tbody = document.querySelector(`#table${tipo.charAt(0).toUpperCase() + tipo.slice(1)} tbody`);
            tbody.innerHTML = logs.map(l => `<tr><td>${l.date}</td><td>${l.value}</td></tr>`).reverse().join('');
        });
    }

    function initChart() {
        const ctx = document.getElementById('resilienceChart').getContext('2d');
        const logs = JSON.parse(localStorage.getItem('gnr_corrida_v2') || "[]");
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: logs.map(l => l.date),
                datasets: [{
                    label: 'Metros',
                    data: logs.map(l => l.metros),
                    borderColor: '#52b788',
                    tension: 0.3,
                    fill: true,
                    backgroundColor: 'rgba(82, 183, 136, 0.1)'
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    window.onload = () => {
        renderTables();
        initChart();
    };
</script>
</body>
</html>
