           <!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Minha Agenda Premium</title>
    <style>
        /* Variáveis de Cores (Estilo Dark Modo com tons Pastéis/Creme) */
        :root {
            --bg-color: #1a1a1d; /* Fundo escuro como na imagem */
            --text-color: #fdfcf7; /* Texto claro, tom de creme suave */
            --primary-color: #4A90E2; /* Azul para destaques */
            --nav-bg: #212124; /* Fundo do cabeçalho e menu */
            --border-color: #3a3a3d; /* Cor das bordas finas */
            
            /* Cores padrão para o seletor livre (caso queiras cores padrão depois) */
            --color-1: #f9e8a5; /* Amarelo Pastel */
            --color-2: #a3cff8; /* Azul Pastel */
            --color-3: #b0edcd; /* Verde Pastel */
            --color-4: #f8bed2; /* Rosa Pastel */
            --color-5: #cab8ed; /* Roxo Pastel */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-top: 60px; /* Espaço para o cabeçalho fixo */
            overflow-x: hidden;
        }

        /* Cabeçalho Fixo */
        header {
            background-color: var(--nav-bg);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        #monthYearDisplay {
            font-size: 1.1rem;
            font-weight: bold;
        }

        #clock {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Ícone de Menu Hambúrguer (3 traços) */
        .hamburger-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        /* Menu de Navegação Hambúrguer */
        nav {
            position: fixed;
            top: 60px; /* Logo abaixo do cabeçalho */
            left: -100%; /* Oculto à esquerda */
            width: 70%;
            height: calc(100% - 60px);
            background-color: var(--nav-bg);
            border-right: 1px solid var(--border-color);
            transition: left 0.3s ease;
            z-index: 999;
            padding: 20px;
        }

        nav.open {
            left: 0;
        }

        nav ul {
            list-style: none;
        }

        nav li {
            margin-bottom: 20px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
            padding: 10px 0;
        }

        nav a.active {
            color: var(--primary-color);
        }

        /* Sobreposição de Menu */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 998;
        }

        .menu-overlay.open {
            display: block;
        }

        /* Separadores (Páginas) */
        .tab-content {
            display: none;
            padding: 15px;
        }

        .tab-content.active {
            display: block;
        }

        /* Calendário Mensal Compacto */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            border-collapse: collapse;
        }

        .weekday {
            font-size: 0.7rem;
            color: #888;
            padding: 5px 0;
            text-transform: uppercase;
        }

        .day {
            padding: 8px 0; /* Menor preenchimento para caber */
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #28282b;
            position: relative;
        }

        /* Bola que preenche o dia de hoje */
        .day.today {
            background-color: #E24A68;
            border-radius: 50%;
            color: white;
            z-index: 1;
        }

        /* Contentor para os pontos coloridos de eventos */
        .event-markers-container {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin-top: 3px;
            width: 80%;
            height: 4px;
        }

        .event-marker {
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }

        /* Formulários (Separador Inserir) */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #aaa;
        }

        input[type="text"], input[type="date"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            background-color: #2a2a2d;
            color: var(--text-color);
        }

        /* Novo Seletor de Cor Livre */
        input[type="color"] {
            border: none;
            border-radius: 6px;
            width: 100%;
            height: 40px;
            cursor: pointer;
            background: none;
        }

        textarea {
            display: none; /* Escondido por defeito */
            margin-top: 10px;
            resize: vertical;
        }

        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* Vista Diária */
        .daily-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .btn-back {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--primary-color);
            margin-right: 15px;
            padding: 5px;
            cursor: pointer;
        }

        /* Lista de Eventos (Design Mosaico) */
        .event-item {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            background-color: #2a2a2d; /* Fundo base */
            display: grid;
            grid-template-columns: 5px 1fr;
            gap: 12px;
        }

        .event-color-strip {
            height: 100%;
            border-radius: 2.5px;
        }

        .event-content {
            display: flex;
            flex-direction: column;
        }

        .event-title {
            font-weight: bold;
            margin-bottom: 4px;
            color: white;
            text-transform: uppercase;
        }

        .event-value, .event-notes {
            color: #aaa;
            font-size: 0.9rem;
        }

    </style>
</head>
<body>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <header>
        <div id="monthYearDisplay">Mês Ano</div>
        <div id="clock">Data • Hora</div>
        <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    </header>

    <nav id="hamburgerMenu">
        <ul>
            <li><a href="#" class="active" onclick="switchTab('home', this)">Calendário</a></li>
            <li><a href="#" onclick="switchTab('insert', this)">Inserir Registo</a></li>
        </ul>
    </nav>

    <main>
        <section id="tab-home" class="tab-content active">
            <div class="calendar-grid">
                <div class="weekday">DOM</div>
                <div class="weekday">SEG</div>
                <div class="weekday">TER</div>
                <div class="weekday">QUA</div>
                <div class="weekday">QUI</div>
                <div class="weekday">SEX</div>
                <div class="weekday">SÁB</div>
            </div>
            <div class="calendar-grid" id="calendarDays">
                </div>
        </section>

        <section id="tab-daily" class="tab-content">
            <div class="daily-header">
                <button class="btn-back" onclick="switchTab('home')">❮</button>
                <h2 id="dailyDateDisplay"></h2>
            </div>
            <div id="dailyEventsList">
                </div>
        </section>

        <section id="tab-insert" class="tab-content">
            <h2>Novo Registo</h2>
            <br>
            <form id="insertForm">
                <div class="form-group">
                    <label for="eventDate">Data</label>
                    <input type="date" id="eventDate" required>
                </div>
                
                <div class="form-group">
                    <label for="eventColor">Paleta de Cor (Livre)</label>
                    <input type="color" id="eventColor" value="#4A90E2" required>
                </div>

                <div class="form-group">
                    <label for="eventType">Tipo (Obrigatório)</label>
                    <input type="text" id="eventType" placeholder="Ex: Trabalho, Reunião, OUTROS" required>
                    <textarea id="eventNotes" rows="4" placeholder="Escreve o que quiseres aqui..."></textarea>
                </div>

                <div class="form-group">
                    <label for="eventValue">Valor (Opcional)</label>
                    <input type="text" id="eventValue" placeholder="Ex: 50€, Importante, etc.">
                </div>

                <button type="submit" class="btn-submit">Guardar</button>
            </form>
        </section>
    </main>

    <script>
        // --- 1. Menu Hambúrguer ---
        const menu = document.getElementById('hamburgerMenu');
        const overlay = document.getElementById('menuOverlay');

        function toggleMenu() {
            menu.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        // --- 2. Relógio a contar no topo ---
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('pt-PT', options);
            const timeStr = now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
            
            // Títulos em maiúsculas
            const finalDateStr = dateStr.toUpperCase();
            document.getElementById('clock').innerText = `${finalDateStr} • ${timeStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock(); // Iniciar imediatamente

        // --- 3. Navegação entre Separadores via Menu ---
        function switchTab(tabName, linkElement = null) {
            // Esconder conteúdos
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            // Tirar o foco de todos os links do menu
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            
            // Mostrar o separador selecionado
            document.getElementById('tab-' + tabName).classList.add('active');
            
            // Atualizar o link ativo
            if (linkElement) {
                linkElement.classList.add('active');
                toggleMenu(); // Fechar o menu após a seleção
            }

            // Se for para a Home, renderizar para mostrar novos marcadores
            if (tabName === 'home') renderCalendar();
        }

        // --- 4. Lógica do Calendário Mensal Compacto ---
        let currentDate = new Date(); // Usado para navegação se quisermos adicionar depois
        
        function renderCalendar() {
            const today = new Date();
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            document.getElementById('monthYearDisplay').innerText = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay(); // Dia da semana do 1º dia
            const daysInMonth = new Date(year, month + 1, 0).getDate(); // Total de dias no mês

            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';

            // Espaços vazios antes do dia 1
            for (let i = 0; i < firstDay; i++) {
                calendarDays.innerHTML += `<div></div>`;
            }

            // Obter eventos existentes para marcadores
            let allEvents = JSON.parse(localStorage.getItem('agendaEvents')) || {};

            // Preencher os dias do mês
            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');
                dayDiv.innerText = i;
                
                // Formato YYYY-MM-DD para referência cruzada
                const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                // Se for o dia de hoje, destaca
                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayDiv.classList.add('today');
                }

                // --- NOVO: Lógica de Marcadores de Cores ---
                let dayEvents = allEvents[dateStr] || [];
                if (dayEvents.length > 0) {
                    const markersContainer = document.createElement('div');
                    markersContainer.classList.add('event-markers-container');
                    
                    // Mostra até 3 marcadores por dia para não encher
                    dayEvents.slice(0, 3).forEach(ev => {
                        const marker = document.createElement('div');
                        marker.classList.add('event-marker');
                        marker.style.backgroundColor = ev.color;
                        markersContainer.appendChild(marker);
                    });
                    
                    dayDiv.appendChild(markersContainer);
                }
                // --- FIM DOS MARCADORES ---

                // Ao carregar num dia, abre a vista diária
                dayDiv.onclick = () => openDailyView(dateStr, i, monthNames[month], year);
                
                calendarDays.appendChild(dayDiv);
            }
        }
        renderCalendar(); // Renderizar ao iniciar

        // --- 5. Lógica de "OUTROS" ---
        const typeInput = document.getElementById('eventType');
        const notesInput = document.getElementById('eventNotes');

        typeInput.addEventListener('input', function() {
            if (this.value.trim().toUpperCase() === 'OUTROS') {
                notesInput.style.display = 'block';
                notesInput.required = true;
            } else {
                notesInput.style.display = 'none';
                notesInput.required = false;
                notesInput.value = ''; // Limpa se não for OUTROS
            }
        });

        // --- 6. Guardar Registo (Local Storage) ---
        document.getElementById('insertForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const date = document.getElementById('eventDate').value;
            const color = document.getElementById('eventColor').value;
            const type = document.getElementById('eventType').value;
            const value = document.getElementById('eventValue').value;
            const notes = document.getElementById('eventNotes').value;

            const newEvent = { color, type, value, notes };

            let events = JSON.parse(localStorage.getItem('agendaEvents')) || {};
            
            if (!events[date]) {
                events[date] = [];
            }
            events[date].push(newEvent);

            localStorage.setItem('agendaEvents', JSON.stringify(events));

            this.reset(); // Limpa o formulário
            notesInput.style.display = 'none'; 
            
            // Volta para o calendário
            switchTab('home');
        });

        // --- 7. Abrir o DIÁRIO (Vista Diária com Design Mosaico) ---
        function openDailyView(dateStr, day, monthName, year) {
            document.getElementById('dailyDateDisplay').innerText = `${day} ${monthName} ${year}`;
            
            const dailyEventsList = document.getElementById('dailyEventsList');
            dailyEventsList.innerHTML = ''; 

            let allEvents = JSON.parse(localStorage.getItem('agendaEvents')) || {};
            let dayEvents = allEvents[dateStr] || [];

            if (dayEvents.length === 0) {
                dailyEventsList.innerHTML = '<p style="color: #666; text-align: center; margin-top: 30px;">Não existem registos.</p>';
            } else {
                dayEvents.forEach(ev => {
                    let eventHTML = `
                        <div class="event-item">
                            <div class="event-color-strip" style="background-color: ${ev.color};"></div>
                            <div class="event-content">
                                <div class="event-title">${ev.type}</div>
                    `;
                    if (ev.value) {
                        eventHTML += `<div class="event-value">${ev.value}</div>`;
                    }
                    if (ev.notes) {
                        eventHTML += `<div class="event-notes">"${ev.notes}"</div>`;
                    }
                    eventHTML += `</div></div>`;
                    dailyEventsList.innerHTML += eventHTML;
                });
            }

            // Pré-preencher a data no formulário
            document.getElementById('eventDate').value = dateStr;

            // Mudar para o separador do Diário
            switchTab('daily');
        }

        // Preencher data de hoje por defeito
        document.getElementById('eventDate').valueAsDate = new Date();
    </script>
</body>
</html>
