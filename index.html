<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>TREINO DO JOÃO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #050a12; --card: #0f172a; --neon: #00ff88; --text: #f1f5f9; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 40px; }
        header { padding: 25px 0; text-align: center; border-bottom: 1px solid rgba(0,255,136,0.2); }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--neon); margin: 0; }
        nav { display: flex; justify-content: space-around; width: 95%; background: var(--card); padding: 12px; border-radius: 15px; margin: 15px auto; position: sticky; top: 10px; z-index: 99; border: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { background: none; border: none; color: #64748b; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
        .tab-btn.active { color: var(--neon); border-bottom: 2px solid var(--neon); }
        .container { width: 92%; max-width: 500px; margin: auto; }
        .page { display: none; } .page.active { display: block !important; }
        .card { background: var(--card); padding: 15px; border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.03); }
        .shoe-stats { display: flex; gap: 10px; } .shoe-box { flex: 1; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; text-align: center; border-bottom: 3px solid var(--neon); }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        input, select { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 10px; color: #fff; }
        .btn-action { background: var(--neon); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 700; margin-top: 5px; }
        .sup-grid { display: flex; gap: 10px; } .sup-btn { flex: 1; padding: 15px; border-radius: 10px; background: #1e293b; color: #fff; border: 1px solid #334155; }
        .sup-btn.checked { background: var(--neon); color: #000; }
    </style>
</head>
<body>

<header>
    <h1>TREINO DO JOÃO</h1>
    <div style="font-size:0.75rem; color:#94a3b8; margin-top:5px; padding:0 10px;">“As feridas passam, tudo passa, mas as conquistas são eternas”</div>
</header>

<nav>
    <button class="tab-btn active" onclick="showPage('home')">Home</button>
    <button class="tab-btn" onclick="showPage('corrida')">Corrida</button>
    <button class="tab-btn" onclick="showPage('forca')">Força</button>
    <button class="tab-btn" onclick="showPage('sup')">Sup</button>
</nav>

<div class="container">
    <div id="home" class="page active">
        <div class="card">
            <h3>Sapatilhas (Km)</h3>
            <div class="shoe-stats">
                <div class="shoe-box">👟 Adidas<br><b id="kmAd">0.0</b></div>
                <div class="shoe-box">👟 Nike<br><b id="kmNi">0.0</b></div>
            </div>
        </div>
        <div class="card">
            <h3 style="font-size:0.8rem;">Metros (X) vs Minutos (Y) [cite: 2026-01-09]</h3>
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <div id="corrida" class="page">
        <div class="card">
            <h3>Registo de Corrida</h3>
            <div class="input-group">
                <input type="number" id="m" placeholder="Metros">
                <input type="text" id="t" placeholder="Tempo (ex: 20:00)">
                <input type="number" step="0.1" id="p" placeholder="Peso (kg)">
                <select id="s"><option value="Adidas">Adidas</option><option value="Nike">Nike</option></select>
                <button class="btn-action" onclick="saveRun()">Gravar Atividade</button>
            </div>
            <div id="resPace" style="color:var(--neon); text-align:center; margin-top:10px; font-weight:bold;"></div>
        </div>
    </div>

    <div id="forca" class="page">
        <div class="card">
            <h3>Treino de Força</h3>
            <div class="input-group">
                <select id="tf"><option value="Abs">Abdominais</option><option value="Barras">Barras</option></select>
                <input type="number" id="vf" placeholder="Quantidade">
                <button class="btn-action" onclick="saveF()">Gravar</button>
            </div>
        </div>
    </div>

    <div id="sup" class="page">
        <div class="card">
            <h3>Suplementos Diários</h3>
            <div class="sup-grid">
                <button id="bC" class="sup-btn" onclick="tSup('C')">Creatina</button>
                <button id="bM" class="sup-btn" onclick="tSup('M')">Multi</button>
            </div>
        </div>
    </div>
</div>

<script>
    let myChart;
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'home') initChart();
    }

    function saveRun() {
        const m = document.getElementById('m').value, t = document.getElementById('t').value, s = document.getElementById('s').value;
        if(!m || !t) return;
        const pts = t.split(':'), sec = parseInt(pts[0])*60 + parseInt(pts[1]);
        const paceM = Math.floor((sec/(m/1000))/60), paceS = Math.round((sec/(m/1000))%60);
        const pace = `${paceM}:${paceS < 10 ? '0' : ''}${paceS}`;
        const entry = { d: new Date().toLocaleDateString('pt-PT'), m: parseFloat(m), t, s, pace, dec: sec/60 };
        let logs = JSON.parse(localStorage.getItem('joao_v9') || "[]");
        logs.push(entry);
        localStorage.setItem('joao_v9', JSON.stringify(logs));
        document.getElementById('resPace').innerText = "Pace: " + pace + " min/km";
        render();
    }

    function tSup(n) {
        document.getElementById('b' + n).classList.add('checked');
        localStorage.setItem('sup_' + n, new Date().toLocaleDateString());
    }

    function render() {
        const logs = JSON.parse(localStorage.getItem('joao_v9') || "[]");
        let ad = 0, ni = 0;
        logs.forEach(l => { if(l.s === 'Adidas') ad += l.m; else ni += l.m; });
        document.getElementById('kmAd').innerText = (ad/1000).toFixed(1);
        document.getElementById('kmNi').innerText = (ni/1000).toFixed(1);
    }

    function initChart() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        const logs = JSON.parse(localStorage.getItem('joao_v9') || "[]");
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: [{ label: 'Treinos', data: logs.map(l => ({ x: l.m, y: l.dec })), backgroundColor: '#00ff88' }] },
            options: { scales: { x: { title: { display: true, text: 'Metros' } }, y: { title: { display: true, text: 'Minutos' } } } }
        });
    }

    window.onload = () => { render(); if(document.getElementById('home').classList.contains('active')) initChart(); };
</script>
</body>
</html>
